<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  /* 글꼴은 fonts/ 폴더에서 render.js 가 자동으로 넣어줘요 (인터넷 없이도 동작) */
  {{FONTFACES}}
  /* ===== 영거진 브랜드 설정 (여기만 바꾸면 전체 톤이 바뀌어요) ===== */
  :root {
    --w: {{WIDTH}}px;
    --h: {{HEIGHT}}px;
    --accent: {{ACCENT}};
    --ink: #121212;
    --paper: #FFF8EC;
    --font: "Pretendard", "Malgun Gothic", sans-serif;
    /* 표지 제목 전용 글꼴 (원고 JSON의 coverFont 로 바꿀 수 있어요) */
    --cover-font: "{{COVER_FONT}}", "Pretendard", "Malgun Gothic", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); }
  body { font-family: var(--font); color: var(--ink); word-break: keep-all; }

  .slide { position: relative; width: var(--w); height: var(--h); overflow: hidden; }

  /* ---------- 공통 ---------- */
  .handle {
    position: absolute; left: 72px; bottom: 56px;
    font-size: 30px; font-weight: 700; letter-spacing: -0.5px; opacity: .85;
  }
  .page {
    position: absolute; right: 72px; bottom: 56px;
    font-size: 30px; font-weight: 700; opacity: .6;
  }
  .pill {
    display: inline-block; padding: 14px 30px; border-radius: 999px;
    background: var(--accent); color: var(--ink);
    font-size: 34px; font-weight: 800; letter-spacing: -0.5px;
    border: 4px solid var(--ink);
  }

  /* ---------- 로고 (오른쪽 위) ---------- */
  .logo { position: absolute; top: 44px; right: 44px; width: 120px; height: 120px; z-index: 5;
          filter: drop-shadow(0 4px 12px rgba(0,0,0,.35)); }
  .logo svg { width: 100%; height: 100%; display: block; }
  .body .logo { top: 84px; right: 84px; width: 96px; height: 96px; filter: none; }

  /* ---------- 표지 (사진 꽉 채움 + 왼쪽 아래 제목) ---------- */
  .cover { background: var(--ink); color: #fff; }
  .cover .bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
  }
  .cover .bg.fallback {
    background:
      radial-gradient(circle at 20% 20%, var(--accent) 0, transparent 45%),
      radial-gradient(circle at 85% 70%, #ffffff22 0, transparent 40%),
      linear-gradient(160deg, #2a2a2a, #0d0d0d);
  }
  /* 위쪽 살짝 + 아래쪽 진하게: 출처 글씨와 제목이 사진 위에서도 읽히게 */
  .cover .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 16%),
      linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.72) 88%);
  }
  .cover .credit {
    position: absolute; top: 52px; left: 56px; z-index: 5;
    font-size: 26px; font-weight: 600; color: #fff; opacity: .92;
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .cover .bottom { position: absolute; left: 64px; right: 64px; bottom: 96px; }
  .cover .kicker {
    font-size: 50px; font-weight: 700; letter-spacing: -1px; margin-bottom: 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  .cover h1 {
    font-family: var(--cover-font);
    font-size: 104px; line-height: 1.16; font-weight: 400; letter-spacing: -2px;
    text-shadow: 0 3px 14px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.4);
  }
  .cover h1 em { font-style: normal; color: var(--accent); }
  .cover .sub {
    margin-top: 22px; font-size: 38px; font-weight: 600; line-height: 1.35;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }

  /* ---------- 본문 ---------- */
  .body { background: var(--paper); }
  .body .frame {
    position: absolute; inset: 48px; border: 5px solid var(--ink); border-radius: 36px;
    background: #fff;
  }
  .body .inner { position: absolute; left: 112px; right: 112px; top: 140px; }
  .body h2 {
    display: inline-block; font-size: 52px; font-weight: 900; letter-spacing: -1.5px;
    background: linear-gradient(transparent 55%, var(--accent) 55%);
    padding: 0 6px;
  }
  .body .text {
    margin-top: 56px; font-size: 64px; line-height: 1.4; font-weight: 800; letter-spacing: -2px;
  }
  .body .text em { font-style: normal; color: #fff; background: var(--ink); padding: 0 12px; border-radius: 10px; }
  .body .note {
    margin-top: 64px; padding: 36px 40px; border-radius: 24px;
    background: var(--paper); border: 4px dashed var(--ink);
    font-size: 40px; line-height: 1.45; font-weight: 600;
  }
  .body .emoji { position: absolute; right: 112px; bottom: 150px; font-size: 140px; }

  /* ---------- 사진 배경 본문 (glass: 흰 반투명 박스 / dark: 어둡게 + 흰 글씨) ---------- */
  .pbody { background: var(--ink); }
  .pbody .bg {
    position: absolute; inset: -20px; background-size: cover; background-position: center;
    filter: blur(var(--blur, 6px));
  }
  .pbody .bg.fallback { background: linear-gradient(160deg, #3a3a3a, #111); }
  .pbody .dim { position: absolute; inset: 0; }
  .pbody.glass .dim { background: rgba(0,0,0,.18); }
  .pbody.dark  .dim { background: rgba(0,0,0,.62); }

  .pbody .panel {
    position: absolute; left: 72px; right: 72px; top: 50%; transform: translateY(-50%);
    padding: 72px 64px;
  }
  .pbody.glass .panel {
    background: rgba(255,255,255,.84); border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    backdrop-filter: blur(14px);
  }
  .pbody.dark .panel { color: #fff; padding: 0 8px; }

  .pbody h2 {
    display: inline-block; font-size: 50px; font-weight: 900; letter-spacing: -1.5px;
    background: linear-gradient(transparent 58%, var(--accent) 58%); padding: 0 6px;
  }
  .pbody.dark h2 { background: none; color: var(--accent); padding: 0; }
  .pbody .text {
    margin-top: 40px; font-size: 66px; line-height: 1.36; font-weight: 800; letter-spacing: -2.5px;
  }
  .pbody .text em { font-style: normal; background: var(--ink); color: #fff; padding: 0 12px; border-radius: 10px; }
  .pbody.dark .text { text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  .pbody.dark .text em { background: var(--accent); color: var(--ink); text-shadow: none; }
  .pbody .note {
    margin-top: 44px; padding: 30px 36px; border-radius: 22px;
    font-size: 38px; line-height: 1.45; font-weight: 600;
    background: rgba(18,18,18,.06); border: 3px dashed rgba(18,18,18,.55);
  }
  .pbody.dark .note { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.6); }
  .pbody .note em { font-style: normal; font-weight: 800; }
  .pbody .emoji { position: absolute; right: 48px; top: -64px; font-size: 112px; }
  .pbody.dark .emoji { right: 0; top: -150px; }

  /* ---------- 비교 인포그래픽 (type: "compare") ---------- */
  .cmp { margin-top: 36px; }
  .cmp-head, .cmp-row { display: grid; grid-template-columns: 230px 1fr 1fr; align-items: center; column-gap: 20px; }
  .cmp-head { padding-bottom: 18px; border-bottom: 3px solid rgba(18,18,18,.15); }
  .cmp-col { text-align: center; }
  .cmp-col .ic { font-size: 84px; line-height: 1; }
  .cmp-col .lb { margin-top: 8px; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .cmp-row { padding: 24px 0; border-bottom: 2px dashed rgba(18,18,18,.18); }
  .cmp-row:last-child { border-bottom: none; }
  .cmp-name { font-size: 38px; font-weight: 900; letter-spacing: -1px; line-height: 1.2; }
  .cmp-desc { margin-top: 6px; font-size: 26px; font-weight: 600; opacity: .65; }
  .cmp-cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .bars { display: flex; gap: 8px; }
  .bars i { display: block; width: 36px; height: 44px; border-radius: 8px;
            background: rgba(18,18,18,.12); }
  .bars i.on { background: var(--ink); }
  .bars.hi i.on { background: var(--accent); box-shadow: inset 0 0 0 3px var(--ink); }
  .tag { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  .cmp-sum { margin-top: 30px; font-size: 52px; font-weight: 900; letter-spacing: -2px; line-height: 1.3; }
  .cmp-sum em { font-style: normal; background: var(--ink); color: #fff; padding: 0 12px; border-radius: 10px; }
  .cmp-foot { margin-top: 18px; font-size: 24px; font-weight: 600; opacity: .55; }
  .pbody.dark .cmp-head { border-color: rgba(255,255,255,.25); }
  .pbody.dark .cmp-row { border-color: rgba(255,255,255,.25); }
  .pbody.dark .bars i { background: rgba(255,255,255,.18); }
  .pbody.dark .bars i.on { background: #fff; }
  .pbody.dark .cmp-sum em { background: var(--accent); color: var(--ink); }

  /* ---------- 추세 그래프 (type: "trend") ---------- */
  .trend { margin-top: 28px; }
  .trend svg { width: 100%; height: auto; display: block; overflow: visible; }
  .trend .grid { stroke: rgba(18,18,18,.15); stroke-width: 2; stroke-dasharray: 6 8; }
  .trend .ln { fill: none; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .trend .ln.ink { stroke: var(--ink); }
  .trend .ln.accent { stroke: var(--accent); }
  .trend .dot.ink { fill: var(--ink); }
  .trend .dot.accent { fill: var(--accent); stroke: var(--ink); stroke-width: 4; }
  .trend .lbl { font-family: var(--font); font-size: 30px; font-weight: 900; letter-spacing: -1px; }
  .trend .lbl.ink { fill: var(--ink); }
  .trend .lbl.accent { fill: var(--ink); }
  .trend .stage { font-family: var(--font); font-size: 30px; font-weight: 800; fill: var(--ink); }
  .trend .icon { font-size: 64px; }
  .pbody.dark .trend .grid { stroke: rgba(255,255,255,.22); }
  .pbody.dark .trend .ln.ink { stroke: #fff; }
  .pbody.dark .trend .dot.ink { fill: #fff; }
  .pbody.dark .trend .lbl, .pbody.dark .trend .stage { fill: #fff; }
  .pbody.dark .trend .dot.accent { stroke: #fff; }

  /* ---------- 실제 통계 (type: "stat") ---------- */
  .stat-big { margin-top: 28px; font-size: 168px; font-weight: 900; letter-spacing: -7px; line-height: 1; }
  .stat-big .unit { font-size: 80px; letter-spacing: -2px; margin-left: 4px; }
  .stat-big .arrow { color: var(--accent); -webkit-text-stroke: 4px var(--ink); margin-left: 8px; }
  .stat-label { margin-top: 16px; font-size: 40px; font-weight: 800; letter-spacing: -1px; }
  .stat-sub { margin-top: 8px; font-size: 30px; font-weight: 600; opacity: .7; }
  .hbar { margin-top: 44px; display: flex; flex-direction: column; gap: 20px; }
  .hbar-row { display: grid; grid-template-columns: 170px 1fr 160px; align-items: center; column-gap: 18px; }
  .hbar-name { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
  .hbar-track { height: 48px; border-radius: 12px; background: rgba(18,18,18,.08); overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 12px; background: var(--ink); }
  .hbar-row.hi .hbar-fill { background: var(--accent); box-shadow: inset 0 0 0 4px var(--ink); }
  .hbar-val { font-size: 38px; font-weight: 900; text-align: right; letter-spacing: -1px; }
  .src { margin-top: 30px; font-size: 24px; font-weight: 600; opacity: .55; }
  .pbody.dark .hbar-track { background: rgba(255,255,255,.15); }
  .pbody.dark .hbar-fill { background: #fff; }
  .pbody.dark .stat-big .arrow { -webkit-text-stroke: 0; }

  /* ---------- 아이콘 목록 (type: "list") ---------- */
  .lst { margin-top: 34px; display: flex; flex-direction: column; gap: 26px; }
  .lst-item { display: grid; grid-template-columns: 76px 1fr; column-gap: 18px; align-items: start; }
  .lst-ic { font-size: 58px; line-height: 1.05; }
  .lst-t { font-size: 40px; font-weight: 900; letter-spacing: -1.2px; line-height: 1.25; }
  .lst-d { margin-top: 6px; font-size: 29px; font-weight: 600; line-height: 1.45; opacity: .8; }
  .lst-t em, .lst-d em { font-style: normal; background: var(--ink); color: #fff; padding: 0 8px; border-radius: 8px; opacity: 1; }
  .lst.compact { gap: 20px; }
  .lst.compact .lst-d { margin-top: 2px; }
  .cta { margin-top: 34px; padding: 26px 30px; border-radius: 22px; background: var(--ink); color: #fff;
         font-size: 34px; font-weight: 800; line-height: 1.4; letter-spacing: -1px; }
  .cta em { font-style: normal; color: var(--accent); }
  .pbody.dark .lst-t em, .pbody.dark .lst-d em { background: var(--accent); color: var(--ink); }
  .pbody.dark .cta { background: var(--accent); color: var(--ink); }
  .pbody.dark .cta em { color: var(--ink); }

  .pbody .handle, .pbody .page { color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.6); opacity: .92; }
  .pbody .logo { top: 44px; right: 44px; width: 104px; height: 104px; }
  .body .handle, .body .page { bottom: 92px; }
  .body .handle { left: 112px; }
  .body .page { right: 112px; }
</style>
</head>
<body>
{{SLIDE}}
</body>
</html>
